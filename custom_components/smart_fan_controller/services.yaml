apply_learned_settings:
  name: Apply learned settings
  description: Apply optimal parameters computed from the learning algorithm. The integration automatically learns the best settings for deadband, soft_error, hard_error, and limit_timeout based on observed system behavior. This service applies those learned parameters and reloads the integration.

reset_learning:
  name: Reset learning
  description: Clear all learning data and restart the learning process from scratch. This removes all collected samples and statistics, allowing the integration to begin learning optimal parameters again.

set_effective_slope:
  name: Set effective slope
  description: Manually set the effective slope for a specific fan mode / HVAC mode profile. Replaces existing samples for that profile with synthetic ones so the learned value matches the provided slope.
  fields:
    hvac_mode:
      name: HVAC mode
      description: The HVAC mode (heat or cool).
      required: true
      example: "heat"
      selector:
        select:
          options:
            - heat
            - cool
    fan_mode:
      name: Fan mode
      description: The fan mode name (e.g. silent, low, med, high, superhigh).
      required: true
      example: "silent"
      selector:
        text:
    effective_slope:
      name: Effective slope
      description: The desired effective slope value in °C/h (positive = towards target).
      required: true
      example: 0.15
      selector:
        number:
          min: -2.0
          max: 5.0
          step: 0.001
          mode: box
          unit_of_measurement: "°C/h"
