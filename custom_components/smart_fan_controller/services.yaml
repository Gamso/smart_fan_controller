apply_learned_settings:
  name: Apply learned settings
  description: Apply optimal parameters computed from the learning algorithm. When several Smart Fan Controller entries are configured, specify the climate entity to target the correct controller.
  fields:
    climate_entity:
      name: Climate entity
      description: Optional when only one Smart Fan Controller entry is configured. Required when several climates are managed.
      required: false
      example: "climate.living_room"
      selector:
        entity:
          domain: climate

reset_learning:
  name: Reset learning
  description: Clear all learning data and restart the learning process from scratch. When several Smart Fan Controller entries are configured, specify the climate entity to target the correct controller.
  fields:
    climate_entity:
      name: Climate entity
      description: Optional when only one Smart Fan Controller entry is configured. Required when several climates are managed.
      required: false
      example: "climate.living_room"
      selector:
        entity:
          domain: climate

set_effective_slope:
  name: Set effective slope
  description: Manually set the effective slope for a specific fan mode / HVAC mode profile. Replaces existing samples for that profile with synthetic ones so the learned value matches the provided slope.
  fields:
    climate_entity:
      name: Climate entity
      description: Optional when only one Smart Fan Controller entry is configured. Required when several climates are managed.
      required: false
      example: "climate.living_room"
      selector:
        entity:
          domain: climate
    hvac_mode:
      name: HVAC mode
      description: The HVAC mode (heat or cool).
      required: true
      example: "heat"
      selector:
        select:
          options:
            - heat
            - cool
    fan_mode:
      name: Fan mode
      description: The fan mode name (e.g. silent, low, med, high, superhigh).
      required: true
      example: "silent"
      selector:
        text:
    effective_slope:
      name: Effective slope
      description: The desired effective slope value in °C/h (positive = towards target).
      required: true
      example: 0.15
      selector:
        number:
          min: -2.0
          max: 5.0
          step: 0.001
          mode: box
          unit_of_measurement: "°C/h"
